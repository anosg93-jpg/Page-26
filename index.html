    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        /* Header Layout */
        .header-card {
            background: #121212;
            color: #fff;
            padding: 30px 20px 25px;
            text-align: center;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .avatar-box {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: #1f1f1f;
            border: 3px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .brand-subtitle {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: #f3d56b;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Action Buttons */
        .main-action-btn {
            background: linear-gradient(135deg, #e52d27, #b31217);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(229, 45, 39, 0.4);
            transition: transform 0.2s;
        }

        .main-action-btn:active {
            transform: scale(0.96);
        }

        /* Grid Icons Section */
        .links-section {
            padding: 25px 20px;
        }

        .section-title {
            font-size: 14px;
            color: #777;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .grid-item {
            background: #f8f9fa;
            border: 1px solid #edf0f3;
            border-radius: 20px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .grid-item:active {
            transform: scale(0.95);
            background: #f0f2f5;
        }

        .icon-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .grid-item span {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        /* Brand Icon Colors */
        .bg-whatsapp { background: #25D366; }
        .bg-facebook { background: #1877F2; }
        .bg-instapay { background: linear-gradient(135deg, #6b21a8, #4c1d95); }
        .bg-vodafone { background: #e60000; }
        .bg-google { background: #4285F4; }
        .bg-maps { background: #ea4335; }
        .bg-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
